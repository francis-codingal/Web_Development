<!DOCTYPE html>
<html>
<head>
  <title>My Cosmic Explorer Card</title>
  <style>

    body {
      background-color: #0b0c10;
      color: #c5c6c7;
      font-family: Arial, sans-serif;
    }

    .hero-name {
      font-size: 60px;
      font-weight: bold;
      color: #66fcf1;
      text-shadow: 3px 3px #45a29e;
    }

    .tagline {
      font-style: italic;
      color: #45a29e;
      text-transform: capitalize;
    }

    .label {
      text-transform: uppercase;
      text-decoration: underline;
      color: #ff007f;
    }

    .power {
      font-weight: bold;
      color: #00ffcc;
    }

    .weakness {
      text-decoration: line-through;
      color: #888888;
    }

    .badge {
      font-size: 28px;
      font-weight: bold;
      color: #ffbd59;
      transform: rotate(15deg);
    }

    .made-by {
      color: #ff007f;
      font-style: italic;
    }

  </style>
</head>
<body>

  <h1 class="hero-name">Starlight Voyager</h1>
  <p class="tagline">guardian of the outer solar system</p>

  <h2 class="label">special abilities</h2>
  <p class="power">Can travel at the speed of light</p>
  <p class="power">Can generate forcefields from star energy</p>

  <h2 class="label">vulnerabilities</h2>
  <p class="weakness">Black hole gravitational pulls</p>
  <p class="weakness">Solar flares</p>

  <p class="badge">Galactic Ace</p>

  <p class="made-by">Created by Astro Kid</p>

</body>
</html>
